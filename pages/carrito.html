<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito | Sashi Pastry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Parisienne&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-page="cart">
    <header class="site-header">
        <a class="brand" href="../index.html">
            <span class="brand-script">Sashi</span>
            <span class="brand-tag">PASTRY</span>
        </a>

        <nav class="main-nav" aria-label="Navegación principal">
            <a href="../index.html">Inicio</a>
            <a class="active" href="./carrito.html">Carrito</a>
            <a href="./contacto.html">Contacto</a>
        </nav>
    </header>

    <main class="page-shell">
        <section class="page-banner">
            <p class="eyebrow">Tu compra</p>
            <h1>Carrito</h1>
        </section>

        <section class="cart-layout">
            <div class="cart-items">
                <article class="cart-item">
                    <div class="item-copy">
                        <h3>Carrito preparado para tu pedido</h3>
                        <p>Actualmente no hay productos en tu carrito. Agregá productos desde el catálogo para poder finalizar tu compra.</p>
                        
                    </div>
                </article>
            </div>

            <aside class="summary-box">
                <h2>Resumen</h2>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span>$0</span>
                </div>
                <div class="summary-row">
                    <span>Envío</span>
                    <span>$0</span>
                </div>
                <div class="summary-row total">
                    <span>Total</span>
                    <span>$0</span>
                </div>
                <a class="button primary" href="./contacto.html">Finalizar compra</a>
            </aside>
        </section>
    </main>

    <footer class="site-footer">
        <p>LA Calidad DE LO CASERO</p>
    </footer>

</body>
</html>
