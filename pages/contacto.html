<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Sashi Pastry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Parisienne&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="../index.html">
            <span class="brand-script">Sashi</span>
            <span class="brand-tag">PASTRY</span>
        </a>

        <nav class="main-nav" aria-label="Navegación principal">
            <a href="../index.html">Inicio</a>
            <a href="./carrito.html">Carrito</a>
            <a class="active" href="./contacto.html">Contacto</a>
        </nav>
    </header>

    <main class="page-shell contact-shell">
        <section class="page-banner">
            <p class="eyebrow">Hablemos</p>
            <h1>Contacto</h1>
        </section>

        <div class="contact-layout">
            <div class="contact-info">
                <h2>Consultas y pedidos</h2>
                <p>Escribinos si querés coordinar un pedido.</p>
                <ul>
                    <li>☎ 11 3450 2309</li>
                    <li>◎ @sashipastry</li>
                    <li>◉ Palermo, CABA</li>
                    <li>✉ hola@sashipastry.com.ar</li>
                </ul>
            </div>

            <form class="contact-form">
                <label>
                    Nombre
                    <input type="text" placeholder="Tu nombre">
                </label>
                <label>
                    Email
                    <input type="email" placeholder="tu@email.com">
                </label>
                <label>
                    Mensaje
                    <textarea rows="5" placeholder="Escribí tu consulta..."></textarea>
                </label>
                <button type="submit" class="button primary">Enviar mensaje</button>
            </form>
        </div>
    </main>

    <footer class="site-footer">
        <p>LA Calidad DE LO CASERO</p>
    </footer>
</body>
</html>
